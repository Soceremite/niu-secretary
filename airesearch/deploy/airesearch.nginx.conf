# Install this inside the existing niu-secretary nginx server block.
location = /niu-secretary/airesearch {
    return 301 /niu-secretary/airesearch/;
}

location /niu-secretary/airesearch/ {
    alias /var/www/html/niu-secretary/airesearch/;
    index index.html;
    try_files $uri $uri/ /niu-secretary/airesearch/index.html;
}
