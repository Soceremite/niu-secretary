default_endpoint: sub2api
endpoints:
  sub2api:
    base_url: http://124.222.22.171:8080/v1
    api_key_env: NIU_GATEWAY_API_KEY
    style: chat_completions
    timeout_s: 120
  dashscope:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: AIRESEARCH_EMBEDDING_API_KEY
    style: chat_completions
    timeout_s: 30
  opencode_go:
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_SUBSCRIPTION_KEY
    style: chat_completions
    timeout_s: 180
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    style: chat_completions
    timeout_s: 120.0
logic_models:
  content:
    # 2026-09-16：主选从 deepseek 官方端点换到 opencode 订阅内同款模型。
    # 官方端点缺 DEEPSEEK_API_KEY，每次调用都要先在本地失败一次再落备选（延迟代价≈0，
    # 但路由表与实际服务方不符）；订阅内已有 deepseek-v4-pro，行为等价。
    endpoint: opencode_go
    model: deepseek-v4-pro
    max_retries: 3
    fallback:
    - endpoint: sub2api
      model: gpt-5.6-luna
    - endpoint: deepseek
      model: deepseek-v4-pro
  vision:
    endpoint: opencode_go
    model: deepseek-v4.1-flash
    max_retries: 2
    fallback:
    - endpoint: sub2api
      model: gpt-5.6-luna
    - endpoint: opencode_go
      model: deepseek-v4-flash-vision-exp
  fact:
    endpoint: opencode_go
    model: deepseek-v4.1-flash
    max_retries: 2
    fallback:
    - endpoint: sub2api
      model: gpt-5.6-luna
  blog:
    endpoint: opencode_go
    model: deepseek-v4.1-flash
    max_retries: 2
    fallback:
    - endpoint: sub2api
      model: gpt-5.6-luna
  translate:
    endpoint: opencode_go
    model: mimo-v2.5
    max_retries: 2
    fallback:
    - endpoint: opencode_go
      model: deepseek-v4.1-flash
    - endpoint: sub2api
      model: gpt-5.6-luna
  formula_ocr:
    endpoint: opencode_go
    model: deepseek-v4.1-flash
    max_retries: 2
    fallback:
    - endpoint: sub2api
      model: gpt-5.6-luna
  embed:
    endpoint: dashscope
    model: text-embedding-v4
    max_retries: 2
  assistant:
    endpoint: opencode_go
    model: glm-5.3-flash
    max_retries: 2
    fallback:
    - endpoint: sub2api
      model: gpt-5.6-sol
  flash:
    endpoint: opencode_go
    model: mimo-v2.5
    timeout_s: 30
