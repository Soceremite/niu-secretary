# Install this inside the existing niu-secretary nginx server block.
#
# Keep dedicated API locations above this block, for example:
# - /niu-secretary/api/
# - /niu-secretary/fitness/api/
#
# Retire legacy module-specific directory locations for:
# /niu-secretary/fitness/, /schedule/, /leisure/, /news/, /airesearch/.
# Otherwise those locations will win before the Vue history fallback.

location = /niu-secretary {
    return 301 /niu-secretary/;
}

location ^~ /niu-secretary/assets/ {
    alias /var/www/html/niu-secretary/assets/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}

location ^~ /niu-secretary/ {
    root /var/www/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Deliberately do not include $uri/ here. Existing legacy module directories
    # stay on disk for rollback, while SPA routes such as /niu-secretary/fitness/
    # and /niu-secretary/admin/fitness/nutrition resolve to the Vue entry.
    # direct legacy file URLs, such as /niu-secretary/fitness/index.html, still work.
    try_files $uri /niu-secretary/index.html;
}
