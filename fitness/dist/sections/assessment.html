<!-- fitness/src/sections/assessment.html -->
<section class="module-grid workbench-section" id="assessment">
  <article class="glass-card priority-card">
    <div class="glass-card-inner">
    <div class="card-head">
      <div>
        <h2>身体评估</h2>
        <p>基础体测、亚太 BMI、BMR/TDEE 和 FMS 风险都会保存到本地。</p>
      </div>
    </div>
    <form id="assessment-form">
      <div class="form-grid">
        <label class="field">日期<input name="date" type="date" required></label>
        <label class="field">目标
          <select name="goal">
            <option value="recomposition">身体重组</option>
            <option value="fat_loss">减脂</option>
            <option value="muscle_gain">增肌</option>
            <option value="posture">体态改善</option>
          </select>
        </label>
        <label class="field">身高 cm<input name="heightCm" type="number" min="120" max="230" value="175" required></label>
        <label class="field">体重 kg<input name="weightKg" type="number" min="20" max="300" step="0.1" value="80" required></label>
        <label class="field">年龄<input name="age" type="number" min="12" max="90" value="32" required></label>
        <label class="field">性别<input name="sex" value="male" placeholder="male/female"></label>
        <label class="field">活动系数<input name="activity" type="number" min="1.2" max="2.2" step="0.05" value="1.45"></label>
        <label class="field">腰围 cm<input name="waistCm" type="number" min="40" max="220" step="0.1" value="88"></label>
        <label class="field">臀围 cm<input name="hipCm" type="number" min="40" max="220" step="0.1"></label>
        <label class="field">胸围 cm<input name="chestCm" type="number" min="40" max="220" step="0.1"></label>
        <label class="field">上臂 cm<input name="armCm" type="number" min="15" max="80" step="0.1"></label>
        <label class="field">大腿 cm<input name="thighCm" type="number" min="25" max="120" step="0.1"></label>
      </div>

      <div class="score-strip">
        <label>深蹲<input name="deepSquat" type="number" min="0" max="3" value="2"></label>
        <label>跨栏步<input name="hurdleStep" type="number" min="0" max="3" value="2"></label>
        <label>弓步<input name="inlineLunge" type="number" min="0" max="3" value="2"></label>
        <label>肩灵活<input name="shoulderMobility" type="number" min="0" max="3" value="2"></label>
        <label>直腿抬高<input name="activeSlr" type="number" min="0" max="3" value="2"></label>
        <label>躯干稳定<input name="trunkStability" type="number" min="0" max="3" value="2"></label>
        <label>旋转稳定<input name="rotaryStability" type="number" min="0" max="3" value="2"></label>
      </div>

      <div class="check-grid">
        <label><input type="checkbox" name="posture" value="圆肩">圆肩</label>
        <label><input type="checkbox" name="posture" value="骨盆前倾">骨盆前倾</label>
        <label><input type="checkbox" name="posture" value="膝内扣">膝内扣</label>
        <label><input type="checkbox" name="posture" value="久坐髋紧">久坐髋紧</label>
        <label><input type="checkbox" name="posture" value="头前伸">头前伸</label>
        <label><input type="checkbox" name="posture" value="足弓塌陷">足弓塌陷</label>
      </div>

      <div class="actions">
        <button class="primary-btn" type="submit">保存评估</button>
      </div>
      <div class="toast" id="assessment-toast"></div>
    </form>
    </div>
  </article>

  <aside class="stack">
    <article class="glass-card result-panel status-card" id="assessment-result">
      <div class="glass-card-inner">
      <div class="empty">保存一次评估后，这里会显示 BMI、TDEE、FMS 风险和训练限制。</div>
      </div>
    </article>
  </aside>

  <article class="glass-card full-row history-card">
    <div class="glass-card-inner">
    <div class="card-head">
      <div>
        <h3>评估历史</h3>
        <p>最近记录保存在 IndexedDB。</p>
      </div>
    </div>
    <div class="log-list" id="assessment-list"></div>
    </div>
  </article>
</section>
