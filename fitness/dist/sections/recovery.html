<!-- fitness/src/sections/recovery.html -->
<section class="module-grid workbench-section" id="recovery">
  <article class="glass-card priority-card">
    <div class="glass-card-inner">
      <div class="card-head"><div><h2>恢复评分</h2><p>恢复评分会同步统一 API，离线时保留本地缓存。</p></div></div>
      <form id="recovery-form">
        <div class="form-grid">
          <label class="field">日期<input name="date" type="date" required></label>
          <label class="field">睡眠小时<input name="sleepHours" type="number" min="0" max="14" step="0.5" value="7"></label>
          <label class="field">睡眠质量 1-5<input name="sleepQuality" type="number" min="1" max="5" value="4"></label>
          <label class="field">压力 1-5<input name="stress" type="number" min="1" max="5" value="3"></label>
          <label class="field">酸痛 1-5<input name="soreness" type="number" min="1" max="5" value="2"></label>
          <label class="field">上次 RPE<input name="lastRpe" type="number" min="1" max="10" step="0.5" value="8"></label>
        </div>
        <div class="actions"><button class="primary-btn" type="submit">保存恢复状态</button><button class="ghost-btn danger-btn" type="button" id="clear-recovery">清空离线缓存</button></div>
        <div class="toast" id="recovery-toast"></div>
      </form>
    </div>
  </article>

  <aside class="stack">
    <article class="glass-card result-panel status-card" id="recovery-result">
      <div class="glass-card-inner">
        <div class="empty">保存一次恢复状态后生成训练建议。</div>
      </div>
    </article>

    <article class="glass-card">
      <div class="glass-card-inner">
        <div class="card-head"><div><h3>恢复趋势</h3><p>最近 7 天的恢复评分变化。</p></div></div>
        <div class="trend-chart" id="recovery-trend-chart"></div>
      </div>
    </article>
  </aside>

  <article class="glass-card full-row history-card">
    <div class="glass-card-inner">
      <div class="card-head"><div><h3>恢复历史</h3><p>在线读取统一 API；接口不可用时使用浏览器离线缓存。</p></div></div>
      <div class="log-list" id="recovery-list"></div>
    </div>
  </article>
</section>
