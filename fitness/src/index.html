<!-- fitness/src/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11080b">
  <title>牛秘书塑形馆</title>
  <link rel="icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="/niu-secretary/dist/platform-widget.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="glow glow-a"></span>
    <span class="glow glow-b"></span>
    <span class="glow glow-c"></span>
  </div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="牛秘书塑形馆首页">
      <img class="brand-logo" src="logo.png" alt="">
      <span>
        <strong>牛秘书塑形馆</strong>
        <small>少点玄学，多点肌肉证据</small>
      </span>
    </a>
    <nav class="module-nav" aria-label="塑形馆模块">
      <button class="nav-chip active" type="button" data-section="dashboard">总览</button>
      <button class="nav-chip" type="button" data-section="assessment">评估</button>
      <button class="nav-chip" type="button" data-section="training">训练</button>
      <button class="nav-chip" type="button" data-section="nutrition">营养</button>
      <button class="nav-chip" type="button" data-section="recovery">恢复</button>
      <button class="nav-chip" type="button" data-section="consult">咨询</button>
    </nav>
    <div class="topbar-actions">
      <a class="home-link" href="/niu-secretary/">返回主页</a>
      <div class="status-pill" id="network-status">检测网络</div>
    </div>
  </header>

  <main class="shell workbench-shell">
    <section class="hero-panel" aria-labelledby="page-title">
      <div class="hero-panel-inner">
        <div>
          <p class="eyebrow" id="page-kicker">Health Workbench</p>
          <h1 id="page-title">身体账本</h1>
          <p style="color: var(--subtle); font-size: 16px; margin-top: 16px; max-width: 540px;">练了多少，吃了多少，还差多少。</p>
        </div>
        <div class="hero-metrics" aria-label="今日概览">
          <div class="hero-metric"><div class="hero-metric-inner"><span id="hero-weight">--</span><small>体重趋势 kg</small></div></div>
          <div class="hero-metric"><div class="hero-metric-inner"><span id="hero-calories">--</span><small>摄入进度</small></div></div>
          <div class="hero-metric"><div class="hero-metric-inner"><span id="hero-recovery">--</span><small>恢复信号</small></div></div>
          <div class="hero-metric"><div class="hero-metric-inner"><span id="hero-sync">0</span><small>待同步</small></div></div>
        </div>
      </div>
    </section>

    <div class="section-host" id="section-host" aria-live="polite">
      <div class="loading-card"><div class="loading-card-inner">正在加载模块，牛秘书在热身...</div></div>
    </div>
    <section data-platform-widget data-platform-module="fitness" aria-label="塑形馆运行状态"></section>
  </main>

  <script type="module" src="js/app.js"></script>
  <script src="/niu-secretary/dist/platform-widget.js" defer></script>
</body>
</html>
