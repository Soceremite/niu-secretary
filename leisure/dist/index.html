<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f1eee7">
  <meta name="description" content="牛秘书闲趣集 - 私人秘书的休闲推荐夹">
  <title>牛秘书闲趣集</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/niu-secretary/dist/platform-widget.css">
</head>
<body data-page="index">

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/niu-secretary/">
        <img src="logo.png" alt="牛秘书">
        <span>
          <span class="brand-name">牛秘书闲趣集</span>
          <span class="brand-caption">Leisure Collection</span>
        </span>
      </a>
      <a class="back-link" href="/niu-secretary/">返回主页</a>
    </div>
  </header>

  <main class="shell">
    <!-- Hero -->
    <section class="leisure-hero">
      <div>
        <h1>闲趣集</h1>
        <p class="lead">按时间和心情精选，今晚看什么、听什么、读什么。</p>
      </div>
      <aside class="taste-card">
        <div class="panel-inner">
          <h2>口味档案</h2>
          <div class="taste-meter"><span></span></div>
          <div class="taste-tags" id="taste-tags"></div>
        </div>
      </aside>
    </section>

    <!-- 导航菜单 -->
    <nav class="nav-menu">
      <a data-nav="index" class="active" href="index.html"><span class="nav-icon">🏠</span>首页</a>
      <a data-nav="movies" href="movies.html"><span class="nav-icon">🎬</span>影视</a>
      <a data-nav="music" href="music.html"><span class="nav-icon">🎵</span>音乐</a>
      <a data-nav="podcasts" href="podcasts.html"><span class="nav-icon">🎙️</span>播客</a>
      <a data-nav="novels" href="novels.html"><span class="nav-icon">📖</span>小说</a>
    </nav>

    <!-- 今晚首推 + 候选 -->
    <section class="recommend-workbench">
      <section class="panel featured-panel">
        <div class="panel-inner">
          <h2>今晚首推</h2>
          <div class="featured-choice" id="featured-choice"></div>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-inner">
          <h2>今日候选</h2>
          <div class="candidate-list" id="candidate-list"></div>
        </div>
      </aside>
    </section>

    <!-- 闲趣批注 -->
    <section class="leisure-note">
      <div>
        <p class="note-label">闲趣批注</p>
        <p id="daily-context-note"><strong>正在分析你的日程和运动状态…</strong></p>
        <p style="margin-top:8px;font-size:13px;color:var(--faint)" id="daily-context-detail">结合塑形馆与时务局数据自动调整推荐</p>
      </div>
      <div class="note-actions">
        <button type="button" onclick="location.reload()">刷新推荐</button>
      </div>
    </section>

    <section class="panel profile-review-panel">
      <div class="panel-inner">
        <div class="profile-review-head">
          <h2>画像建议</h2>
          <span id="profile-suggestion-count">--</span>
        </div>
        <div class="profile-suggestion-list" id="profile-suggestion-list"></div>
      </div>
    </section>
    <section data-platform-widget data-platform-module="leisure" aria-label="闲趣集运行状态"></section>
  </main>

  <!-- 详情弹窗 -->
  <div class="detail-overlay" id="detail-overlay" onclick="closeDetail(event)">
    <div class="detail-sheet" id="detail-sheet" onclick="event.stopPropagation()">
      <button class="detail-close" onclick="closeDetail()">✕</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <footer class="footer">
    <p>牛秘书闲趣集 · <a href="/niu-secretary/">牛秘书品牌主页</a></p>
  </footer>

  <script src="js/offline-feedback.js"></script>
  <script src="js/nav.js"></script>
  <script src="/niu-secretary/dist/platform-widget.js" defer></script>
  <script>
    const LEISURE_API_BASE = '/niu-secretary/api';
    async function getLeisureJson(path) {
      const res = await fetch(LEISURE_API_BASE + path);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.message || ('读取接口失败：' + res.status));
      return data;
    }

    async function executeLeisureAction(action, input, context) {
      const res = await fetch(LEISURE_API_BASE + '/actions/execute', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, input: input || {}, context: context || { client: 'web' } })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.message || ('执行接口失败：' + res.status));
      return data;
    }

    function leisureEscape(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }

    function formatPatch(patch) {
      const parts = [];
      if (patch.genres) {
        Object.keys(patch.genres).forEach(function(key) {
          const values = Array.isArray(patch.genres[key]) ? patch.genres[key] : [];
          if (values.length) parts.push(key + ': ' + values.slice(0, 4).join('、'));
        });
      }
      if (Array.isArray(patch.moods) && patch.moods.length) parts.push('moods: ' + patch.moods.slice(0, 4).join('、'));
      if (Array.isArray(patch.avoid) && patch.avoid.length) parts.push('avoid: ' + patch.avoid.slice(0, 3).join('、'));
      return parts.join(' · ') || '画像无新增字段';
    }

    async function loadProfileSuggestions() {
      const listEl = document.getElementById('profile-suggestion-list');
      const countEl = document.getElementById('profile-suggestion-count');
      try {
        const data = await getLeisureJson('/leisure/profile/suggestions?limit=5');
        const items = data.items || [];
        countEl.textContent = String(items.length);
        if (!items.length) {
          listEl.innerHTML = '<p class="suggestion-empty">暂无待处理建议</p>';
          return;
        }
        listEl.innerHTML = items.map(function(item) {
          const payload = item.payload || {};
          const itemInfo = payload.item || {};
          return `<article class="suggestion-item" data-event-id="${leisureEscape(item.id)}">
            <div>
              <b>${leisureEscape(itemInfo.title || item.title)}</b>
              <small>${leisureEscape(formatPatch(payload.patch || {}))}</small>
            </div>
            <button type="button" data-apply-suggestion="${leisureEscape(item.id)}">应用</button>
          </article>`;
        }).join('');
      } catch (error) {
        countEl.textContent = '0';
        listEl.innerHTML = '<p class="suggestion-empty">画像建议暂不可用</p>';
      }
    }

    document.addEventListener('click', async function(event) {
      const btn = event.target.closest('[data-apply-suggestion]');
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = '应用中';
      try {
        await executeLeisureAction(
          'leisure.profile.apply_suggestion',
          { eventId: btn.getAttribute('data-apply-suggestion') },
          { client: 'web', confirmed: true }
        );
        await Promise.all([loadTasteProfile(), loadProfileSuggestions()]);
      } catch (error) {
        btn.disabled = false;
        btn.textContent = '重试';
      }
    });

    // 画像驱动的口味档案（后端为权威，空则回落到静态标签）
    async function loadTasteProfile() {
      const tagsEl = document.getElementById('taste-tags');
      try {
        const data = await getLeisureJson('/profile?module=leisure');
        const p = data.profile || {};
        const tags = [];
        const g = p.genres || {};
        ['movie', 'music', 'podcast', 'novel'].forEach(function(k) {
          (Array.isArray(g[k]) ? g[k] : []).forEach(function(x) { if (x) tags.push(x); });
        });
        (Array.isArray(p.moods) ? p.moods : []).forEach(function(m) { if (m) tags.push(m); });
        const unique = Array.from(new Set(tags));
        if (unique.length) {
          tagsEl.innerHTML = unique.slice(0, 8).map(function(t) { return '<span>' + t + '</span>'; }).join('');
        } else {
          tagsEl.innerHTML = ['去主页和牛秘书 AI 聊聊', '说说你爱看什么'].map(function(t) { return '<span>' + t + '</span>'; }).join('');
        }
      } catch (e) {
        tagsEl.innerHTML = ['轻松', '不烧脑', '90 分钟内', '华语'].map(function(t) { return '<span>' + t + '</span>'; }).join('');
      }
    }

    // 实时获取日程/运动数据（后端为唯一数据源）
    async function loadRealtimeContext() {
      const todayStr = new Date().toISOString().slice(0, 10);
      const detailEl = document.getElementById('daily-context-detail');
      const noteEl = document.getElementById('daily-context-note');

      // 并行拉取日程和运动数据
      let taskCount = 0, busyLevel = '适中', hasWorkout = false, intensity = '无';
      let scheduleOk = false, fitnessOk = false;

      try {
        const schedRes = await getLeisureJson('/schedule/events?from=' + encodeURIComponent(todayStr) + '&to=' + encodeURIComponent(todayStr));
        taskCount = (schedRes.items || []).length;
        busyLevel = taskCount >= 5 ? '繁忙' : taskCount >= 3 ? '适中' : '轻松';
        scheduleOk = true;
      } catch (e) { /* 后端不可用时保持默认 */ }

      try {
        const fitRes = await getLeisureJson('/fitness/nutrition?from=' + encodeURIComponent(todayStr) + '&to=' + encodeURIComponent(todayStr));
        const logs = fitRes.items || [];
        hasWorkout = logs.length > 0;
        if (hasWorkout) {
          const totalCal = logs.reduce((s, l) => s + Number(l.calories || 0), 0);
          intensity = totalCal > 1500 ? '高' : totalCal > 800 ? '中等' : '低';
        }
        fitnessOk = true;
      } catch (e) { /* 后端不可用时保持默认 */ }

      // 同时加载 cron 生成的 AI 批注（dailyNote 等）
      let dailyNote = '', moodLabel = '平衡舒缓', cronTime = '';
      try {
        const ctxRes = await fetch('data/context.json');
        if (ctxRes.ok) {
          const ctx = await ctxRes.json();
          dailyNote = ctx.dailyNote || '';
          moodLabel = (ctx.moodProfile && ctx.moodProfile.label) || '平衡舒缓';
          cronTime = ctx.generated ? ctx.generated.slice(11, 16) : '';
        }
      } catch (e) {}

      // 渲染：优先用实时数据，AI 批注用 cron 生成的
      if (dailyNote) {
        noteEl.innerHTML = `<strong>${dailyNote}</strong>`;
      } else {
        // cron 未生成或失败时，根据实时数据生成简单的批注
        const mood = busyLevel === '繁忙' ? '轻量放松' : busyLevel === '轻松' ? '烧脑沉浸' : '平衡舒缓';
        noteEl.innerHTML = `<strong>今天日程${busyLevel}（${taskCount}项），${hasWorkout ? '有运动记录' : '暂无运动'}——适合${mood}的内容。</strong>`;
      }

      const timeLabel = scheduleOk || fitnessOk ? '实时' : (cronTime ? `更新于 ${cronTime}` : '默认');
      detailEl.textContent = `日程${busyLevel}(${taskCount}项) · 运动${hasWorkout ? intensity : '休息'} · ${moodLabel} · ${timeLabel}`;
    }

    (async function() {
      // 画像不阻塞主内容渲染
      loadTasteProfile();
      loadProfileSuggestions();

      // 实时上下文（后端 API 优先，cron 静态文件补充 AI 批注）
      loadRealtimeContext();

      // 加载所有数据
      let allData = {};
      const [moviesData, musicData, podcastsData, novelsData] = await Promise.all([
        loadSectionData('movies', 'data/movies.json'),
        loadSectionData('music', 'data/music.json'),
        loadSectionData('podcasts', 'data/podcasts.json'),
        loadSectionData('novels', 'data/novels.json'),
      ]);

      function reg(type, data) {
        (data || []).forEach((item, i) => { allData[`${type}:${i}`] = item; });
      }
      reg('影视', moviesData); reg('音乐', musicData); reg('播客', podcastsData); reg('小说', novelsData);

      // 构建精选列表：画像驱动的 leisure.recommend 是唯一推荐来源。
      const items = [];
      const CAT_TYPE = { movie: '影视', music: '音乐', podcast: '播客', novel: '小说' };
      const CAT_DATA = { movie: moviesData, music: musicData, podcast: podcastsData, novel: novelsData };
      const CAT_DUR = { movie: '45分钟', music: '30分钟', podcast: '18分钟', novel: '60分钟' };

      let recommendError = '';
      try {
        const rec = await getLeisureJson('/leisure/recommend?limit=2');
        const groups = rec.groups || [];
        groups.forEach(function(group) {
          const type = CAT_TYPE[group.category];
          const dataArr = CAT_DATA[group.category] || [];
          (group.items || []).forEach(function(recItem) {
            // 用 id 在原始数据里找下标，以复用 allData / showDetail
            const idx = dataArr.findIndex(function(d) { return d.id && d.id === recItem.id; });
            if (idx >= 0) {
              items.push(normalize(dataArr[idx], type, '#', CAT_DUR[group.category], idx));
            }
          });
        });
      } catch (e) {
        recommendError = e.message || '推荐接口暂不可用';
      }

      // 首推
      const featured = items[0] || null;
      const featuredRaw = featured ? allData[`${featured.type}:${featured.rawIndex || 0}`] : null;

      const posterUrl = (featuredRaw && (featuredRaw.posterUrl || featuredRaw.coverUrl)) || '';
      const finalPoster = posterUrl;

      let metaHtml = '';
      if (featuredRaw) {
        const mp = [];
        if (featuredRaw.type) mp.push(featuredRaw.type);
        if (featuredRaw.year) mp.push(featuredRaw.year + '年');
        if (featuredRaw.region) mp.push(featuredRaw.region);
        if (featuredRaw.duration) {
          const d = typeof featuredRaw.duration === 'number' ? featuredRaw.duration + '分钟' : featuredRaw.duration;
          mp.push(d);
        }
        if (featuredRaw.doubanRating) mp.push('⭐ ' + featuredRaw.doubanRating);
        if (mp.length) metaHtml = `<div class="feature-meta">${leisureEscape(mp.join(' · '))}</div>`;
        if (featuredRaw.genres && featuredRaw.genres.length) {
          metaHtml += `<div class="feature-tags">${featuredRaw.genres.map(g => `<span>${leisureEscape(g)}</span>`).join('')}</div>`;
        }
        if (featuredRaw.director) metaHtml += `<div class="feature-credit">导演：${leisureEscape(featuredRaw.director)}</div>`;
        if (featuredRaw.actors) metaHtml += `<div class="feature-credit">主演：${leisureEscape(featuredRaw.actors)}</div>`;
      }

      if (featured) {
        document.getElementById('featured-choice').innerHTML = `
          <div class="poster" aria-hidden="true">
            ${finalPoster
              ? `<img class="poster-img" src="${finalPoster}" alt="${leisureEscape(featured.title)}" onerror="this.style.display='none'">`
              : ''}
            <span class="poster-label">今夜</span>
          </div>
          <div class="feature-copy">
            <h3>${leisureEscape(featured.title)}</h3>
            ${metaHtml}
            <p class="feature-reason">${leisureEscape(featured.reason)}</p>
            <span class="score">匹配度 ${Number(featured.score || 0)}%</span>
            ${featuredRaw && featuredRaw.doubanUrl ? `<a class="feature-link" href="${leisureEscape(featuredRaw.doubanUrl)}" target="_blank" rel="noopener">🔗 查看豆瓣详情</a>` : ''}
          </div>
        `;
      } else {
        document.getElementById('featured-choice').innerHTML = `
          <div class="feature-empty">
            <strong>今晚首推暂不可用</strong>
            <span>${leisureEscape(recommendError || '后端暂未返回推荐结果')}</span>
          </div>
        `;
      }

      // 候选列表 - 按类别汇总，只显示4个类别卡片
      const categorySummary = [
        { label: '影视', href: 'movies.html', icon: '影', color: '#66848e', count: moviesData.length, desc: moviesData.slice(0, 2).map(m => m.title).join('、') || '暂无' },
        { label: '音乐', href: 'music.html', icon: '音', color: '#8b5a3c', count: musicData.length, desc: musicData.slice(0, 2).map(m => m.title).join('、') || '暂无' },
        { label: '播客', href: 'podcasts.html', icon: '播', color: '#a67c52', count: podcastsData.length, desc: podcastsData.slice(0, 2).map(p => p.title || p.episode).join('、') || '暂无' },
        { label: '小说', href: 'novels.html', icon: '书', color: '#c4a57b', count: novelsData.length, desc: novelsData.slice(0, 2).map(n => n.title).join('、') || '暂无' }
      ];

      document.getElementById('candidate-list').innerHTML = categorySummary.map((cat) => {
        return `<a href="${cat.href}" class="candidate category-card">
          <span class="candidate-icon" style="background:${cat.color}">${cat.icon}</span>
          <div class="candidate-content">
            <b>${cat.label}</b>
            <small>${cat.desc}</small>
          </div>
          <span class="count-badge">${cat.count}项</span>
        </a>`;
      }).join('');

      initScrollReveal();
    })();
  </script>
</body>
</html>
