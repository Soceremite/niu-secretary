<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f1eee7">
  <meta name="description" content="牛秘书闲趣集 - 私人秘书的休闲推荐夹">
  <title>牛秘书闲趣集</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="index">

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/niu-secretary/">
        <img src="logo.png" alt="牛秘书">
        <span>
          <span class="brand-name">牛秘书闲趣集</span>
          <span class="brand-caption">Leisure Collection</span>
        </span>
      </a>
      <a class="back-link" href="/niu-secretary/">返回主页</a>
    </div>
  </header>

  <main class="shell">
    <!-- Hero -->
    <section class="leisure-hero">
      <div>
        <h1>闲趣集</h1>
        <p class="lead">按时间和心情精选，今晚看什么、听什么、读什么。</p>
      </div>
      <aside class="taste-card">
        <div class="panel-inner">
          <h2>口味档案</h2>
          <div class="taste-meter"><span></span></div>
          <div class="taste-tags" id="taste-tags"></div>
        </div>
      </aside>
    </section>

    <!-- 导航菜单 -->
    <nav class="nav-menu">
      <a data-nav="index" class="active" href="index.html"><span class="nav-icon">🏠</span>首页</a>
      <a data-nav="movies" href="movies.html"><span class="nav-icon">🎬</span>影视</a>
      <a data-nav="music" href="music.html"><span class="nav-icon">🎵</span>音乐</a>
      <a data-nav="podcasts" href="podcasts.html"><span class="nav-icon">🎙️</span>播客</a>
      <a data-nav="novels" href="novels.html"><span class="nav-icon">📖</span>小说</a>
    </nav>

    <!-- 今晚首推 + 候选 -->
    <section class="recommend-workbench">
      <section class="panel featured-panel">
        <div class="panel-inner">
          <h2>今晚首推</h2>
          <div class="featured-choice" id="featured-choice"></div>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-inner">
          <h2>今日候选</h2>
          <div class="candidate-list" id="candidate-list"></div>
        </div>
      </aside>
    </section>

    <!-- 闲趣批注 -->
    <section class="leisure-note">
      <div>
        <p class="note-label">闲趣批注</p>
        <p id="daily-context-note"><strong>正在分析你的日程和运动状态…</strong></p>
        <p style="margin-top:8px;font-size:13px;color:var(--faint)" id="daily-context-detail">结合塑形馆与时务局数据自动调整推荐</p>
      </div>
      <div class="note-actions">
        <button type="button" onclick="location.reload()">刷新推荐</button>
      </div>
    </section>
  </main>

  <!-- 详情弹窗 -->
  <div class="detail-overlay" id="detail-overlay" onclick="closeDetail(event)">
    <div class="detail-sheet" id="detail-sheet" onclick="event.stopPropagation()">
      <button class="detail-close" onclick="closeDetail()">✕</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <footer class="footer">
    <p>牛秘书闲趣集 · <a href="/niu-secretary/">牛秘书品牌主页</a></p>
  </footer>

  <script src="js/nav.js"></script>
  <script>
    const LEISURE_ACTION_API = '/niu-secretary/api/actions/execute';
    async function callLeisureAction(action, input) {
      const res = await fetch(LEISURE_ACTION_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, input, context: { client: 'leisure-page' } })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.message || ('动作接口失败：' + res.status));
      return data;
    }

    // 画像驱动的口味档案（后端为权威，空则回落到静态标签）
    async function loadTasteProfile() {
      const tagsEl = document.getElementById('taste-tags');
      try {
        const data = await callLeisureAction('profile.get', { module: 'leisure' });
        const p = data.profile || {};
        const tags = [];
        const g = p.genres || {};
        ['movie', 'music', 'podcast', 'novel'].forEach(function(k) {
          (Array.isArray(g[k]) ? g[k] : []).forEach(function(x) { if (x) tags.push(x); });
        });
        (Array.isArray(p.moods) ? p.moods : []).forEach(function(m) { if (m) tags.push(m); });
        const unique = Array.from(new Set(tags));
        if (unique.length) {
          tagsEl.innerHTML = unique.slice(0, 8).map(function(t) { return '<span>' + t + '</span>'; }).join('');
        } else {
          tagsEl.innerHTML = ['去主页和牛秘书 AI 聊聊', '说说你爱看什么'].map(function(t) { return '<span>' + t + '</span>'; }).join('');
        }
      } catch (e) {
        tagsEl.innerHTML = ['轻松', '不烧脑', '90 分钟内', '华语'].map(function(t) { return '<span>' + t + '</span>'; }).join('');
      }
    }

    // 实时获取日程/运动数据（后端为唯一数据源）
    async function loadRealtimeContext() {
      const todayStr = new Date().toISOString().slice(0, 10);
      const detailEl = document.getElementById('daily-context-detail');
      const noteEl = document.getElementById('daily-context-note');

      // 并行拉取日程和运动数据
      let taskCount = 0, busyLevel = '适中', hasWorkout = false, intensity = '无';
      let scheduleOk = false, fitnessOk = false;

      try {
        const schedRes = await callLeisureAction('schedule.event.list', { from: todayStr, to: todayStr });
        taskCount = (schedRes.items || []).length;
        busyLevel = taskCount >= 5 ? '繁忙' : taskCount >= 3 ? '适中' : '轻松';
        scheduleOk = true;
      } catch (e) { /* 后端不可用时保持默认 */ }

      try {
        const fitRes = await callLeisureAction('fitness.nutrition.list', { from: todayStr, to: todayStr });
        const logs = fitRes.items || [];
        hasWorkout = logs.length > 0;
        if (hasWorkout) {
          const totalCal = logs.reduce((s, l) => s + Number(l.calories || 0), 0);
          intensity = totalCal > 1500 ? '高' : totalCal > 800 ? '中等' : '低';
        }
        fitnessOk = true;
      } catch (e) { /* 后端不可用时保持默认 */ }

      // 同时加载 cron 生成的 AI 批注（dailyNote 等）
      let dailyNote = '', moodLabel = '平衡舒缓', cronTime = '';
      try {
        const ctxRes = await fetch('data/context.json');
        if (ctxRes.ok) {
          const ctx = await ctxRes.json();
          dailyNote = ctx.dailyNote || '';
          moodLabel = (ctx.moodProfile && ctx.moodProfile.label) || '平衡舒缓';
          cronTime = ctx.generated ? ctx.generated.slice(11, 16) : '';
        }
      } catch (e) {}

      // 渲染：优先用实时数据，AI 批注用 cron 生成的
      if (dailyNote) {
        noteEl.innerHTML = `<strong>${dailyNote}</strong>`;
      } else {
        // cron 未生成或失败时，根据实时数据生成简单的批注
        const mood = busyLevel === '繁忙' ? '轻量放松' : busyLevel === '轻松' ? '烧脑沉浸' : '平衡舒缓';
        noteEl.innerHTML = `<strong>今天日程${busyLevel}（${taskCount}项），${hasWorkout ? '有运动记录' : '暂无运动'}——适合${mood}的内容。</strong>`;
      }

      const timeLabel = scheduleOk || fitnessOk ? '实时' : (cronTime ? `更新于 ${cronTime}` : '默认');
      detailEl.textContent = `日程${busyLevel}(${taskCount}项) · 运动${hasWorkout ? intensity : '休息'} · ${moodLabel} · ${timeLabel}`;
    }

    (async function() {
      // 画像不阻塞主内容渲染
      loadTasteProfile();

      // 实时上下文（后端 API 优先，cron 静态文件补充 AI 批注）
      loadRealtimeContext();

      // 加载所有数据
      let allData = {};
      const [moviesData, musicData, podcastsData, novelsData] = await Promise.all([
        loadSectionData('movies', 'data/movies.json'),
        loadSectionData('music', 'data/music.json'),
        loadSectionData('podcasts', 'data/podcasts.json'),
        loadSectionData('novels', 'data/novels.json'),
      ]);

      function reg(type, data) {
        (data || []).forEach((item, i) => { allData[`${type}:${i}`] = item; });
      }
      reg('影视', moviesData); reg('音乐', musicData); reg('播客', podcastsData); reg('小说', novelsData);

      // 构建精选列表：优先用画像驱动的 leisure.recommend，失败回落到默认顺序
      const items = [];
      const CAT_TYPE = { movie: '影视', music: '音乐', podcast: '播客', novel: '小说' };
      const CAT_DATA = { movie: moviesData, music: musicData, podcast: podcastsData, novel: novelsData };
      const CAT_DUR = { movie: '45分钟', music: '30分钟', podcast: '18分钟', novel: '60分钟' };

      let usedRecommend = false;
      try {
        const rec = await callLeisureAction('leisure.recommend', { limit: 2 });
        const groups = rec.groups || [];
        groups.forEach(function(group) {
          const type = CAT_TYPE[group.category];
          const dataArr = CAT_DATA[group.category] || [];
          (group.items || []).forEach(function(recItem) {
            // 用 id 在原始数据里找下标，以复用 allData / showDetail
            const idx = dataArr.findIndex(function(d) { return d.id && d.id === recItem.id; });
            if (idx >= 0) {
              items.push(normalize(dataArr[idx], type, '#', CAT_DUR[group.category], idx));
            }
          });
        });
        usedRecommend = items.length > 0;
      } catch (e) { /* 回落 */ }

      if (!usedRecommend) {
        moviesData.slice(0, 2).forEach((item, i) => items.push(normalize(item, '影视', '#', '45分钟', i)));
        musicData.slice(0, 1).forEach((item, i) => items.push(normalize(item, '音乐', '#', '30分钟', i)));
        podcastsData.slice(0, 1).forEach((item, i) => items.push(normalize(item, '播客', '#', '18分钟', i)));
        novelsData.slice(0, 1).forEach((item, i) => items.push(normalize(item, '小说', '#', '60分钟', i)));
      }

      if (items.length === 0) {
        items.push(
          { type: '影视', href: '#', title: '短片 / 剧集', reason: '睡前不沉重', score: 86, duration: '45分钟' },
          { type: '音乐', href: '#', title: '音乐电台', reason: '通勤时也能听', score: 82, duration: '30分钟' },
          { type: '播客', href: '#', title: '播客片段', reason: '只听重点', score: 80, duration: '18分钟' },
          { type: '小说', href: '#', title: '睡前阅读', reason: '轻散文收尾', score: 78, duration: '12分钟' },
        );
      }

      // 首推
      const featured = items[0];
      const featuredRaw = items.length ? allData[`${featured.type}:${featured.rawIndex || 0}`] : null;

      const posterUrl = (featuredRaw && (featuredRaw.posterUrl || featuredRaw.coverUrl)) || '';
      const finalPoster = posterUrl || (featuredRaw && featuredRaw.id ? `data/poster-${featuredRaw.id}.jpg` : '');

      let metaHtml = '';
      if (featuredRaw) {
        const mp = [];
        if (featuredRaw.type) mp.push(featuredRaw.type);
        if (featuredRaw.year) mp.push(featuredRaw.year + '年');
        if (featuredRaw.region) mp.push(featuredRaw.region);
        if (featuredRaw.duration) {
          const d = typeof featuredRaw.duration === 'number' ? featuredRaw.duration + '分钟' : featuredRaw.duration;
          mp.push(d);
        }
        if (featuredRaw.doubanRating) mp.push('⭐ ' + featuredRaw.doubanRating);
        if (mp.length) metaHtml = `<div class="feature-meta">${mp.join(' · ')}</div>`;
        if (featuredRaw.genres && featuredRaw.genres.length) {
          metaHtml += `<div class="feature-tags">${featuredRaw.genres.map(g => `<span>${g}</span>`).join('')}</div>`;
        }
        if (featuredRaw.director) metaHtml += `<div class="feature-credit">导演：${featuredRaw.director}</div>`;
        if (featuredRaw.actors) metaHtml += `<div class="feature-credit">主演：${featuredRaw.actors}</div>`;
      }

      document.getElementById('featured-choice').innerHTML = `
        <div class="poster" aria-hidden="true">
          ${finalPoster
            ? `<img class="poster-img" src="${finalPoster}" alt="${featured.title}" onerror="this.style.display='none'">`
            : ''}
          <span class="poster-label">今夜</span>
        </div>
        <div class="feature-copy">
          <h3>${featured.title}</h3>
          ${metaHtml}
          <p class="feature-reason">${featured.reason}</p>
          <span class="score">匹配度 ${featured.score}%</span>
          ${featuredRaw && featuredRaw.doubanUrl ? `<a class="feature-link" href="${featuredRaw.doubanUrl}" target="_blank" rel="noopener">🔗 查看豆瓣详情</a>` : ''}
        </div>
      `;

      // 候选列表 - 按类别汇总，只显示4个类别卡片
      const categorySummary = [
        { type: '影视', icon: '影', color: '#66848e', count: moviesData.length, desc: moviesData.slice(0, 2).map(m => m.title).join('、') || '暂无' },
        { type: '音乐', icon: '音', color: '#8b5a3c', count: musicData.length, desc: musicData.slice(0, 2).map(m => m.title).join('、') || '暂无' },
        { type: '播客', icon: '播', color: '#a67c52', count: podcastsData.length, desc: podcastsData.slice(0, 2).map(p => p.title || p.episode).join('、') || '暂无' },
        { type: '小说', icon: '书', color: '#c4a57b', count: novelsData.length, desc: novelsData.slice(0, 2).map(n => n.title).join('、') || '暂无' }
      ];

      document.getElementById('candidate-list').innerHTML = categorySummary.map((cat) => {
        return `<a href="${cat.type}.html" class="candidate category-card">
          <span class="candidate-icon" style="background:${cat.color}">${cat.icon}</span>
          <div class="candidate-content">
            <b>${cat.type}</b>
            <small>${cat.desc}</small>
          </div>
          <span class="count-badge">${cat.count}项</span>
        </a>`;
      }).join('');

      initScrollReveal();
    })();
  </script>
</body>
</html>
