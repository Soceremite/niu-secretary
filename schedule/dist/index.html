<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e8ece6">
  <meta name="description" content="牛秘书时务局 - 现代私人秘书事务夹，整理今日排班、提醒、代办和目标。">
  <title>牛秘书时务局</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Noto+Serif+SC:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #e8ece6;
      --paper: #fffefa;
      --paper-soft: #f5f7f2;
      --ink: #243039;
      --muted: #59676b;
      --faint: #7c8889;
      --sage: #6f857a;
      --navy: #243746;
      --copper: #d0b37c;
      --copper-dark: #b09760;
      --line: #ccd5ce;
      --line-soft: #e0e4dd;
      --shadow-tinted: 0 24px 80px rgba(34, 48, 54, .12);
      --shadow-inner: inset 0 1px 0 rgba(255, 255, 255, .6);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.45, 0, 0.55, 1);
    }

    * { box-sizing: border-box; }
    html { background: var(--page); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Plus Jakarta Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(circle at 12% 8%, rgba(208, 179, 124, .20), transparent 32rem),
        radial-gradient(circle at 88% 12%, rgba(111, 133, 122, .18), transparent 30rem),
        linear-gradient(135deg, rgba(255,255,255,.46), rgba(255,255,255,.08)),
        var(--page);
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(190, 200, 189, .82);
      background: rgba(232, 236, 230, .82);
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      min-height: 68px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--copper);
      box-shadow: 0 8px 22px rgba(74, 82, 74, .12);
    }

    .brand-name {
      display: block;
      color: var(--ink);
      font-family: "Noto Serif SC", serif;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: .03em;
      line-height: 1.1;
    }

    .brand-caption {
      display: block;
      margin-top: 3px;
      color: var(--sage);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,250,.45);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.3s var(--ease-spring);
    }
    .back-link:hover {
      color: var(--ink);
      border-color: var(--copper);
      transform: translateX(-3px);
      box-shadow: 0 4px 12px rgba(34, 48, 54, .08);
    }

    .schedule-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 24px 72px;
    }

    .bureau-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 148px;
      gap: 32px;
      align-items: end;
      padding: 3px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(255, 255, 250, .9), rgba(224, 228, 221, .6));
      box-shadow: var(--shadow-tinted);
    }

    .bureau-hero-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 148px;
      gap: 32px;
      align-items: end;
      padding: 36px;
      border-radius: calc(var(--radius-lg) - 3px);
      background: rgba(255, 255, 250, .54);
      box-shadow: var(--shadow-inner);
    }

    .kicker {
      margin: 0 0 14px;
      color: var(--sage);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    h1, h2, h3 {
      font-family: "Noto Serif SC", serif;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    p {
      max-width: 65ch;
      line-height: 1.7;
    }

    h1 {
      color: #1e2b34;
      font-size: clamp(48px, 8vw, 96px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    h2 {
      font-size: clamp(20px, 3vw, 24px);
      font-weight: 700;
      margin-bottom: 12px;
    }

    h3 {
      font-size: clamp(16px, 2.5vw, 18px);
      font-weight: 600;
    }

    .lead {
      max-width: 540px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 18px);
      font-weight: 500;
      line-height: 1.6;
    }

    .date-card {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      text-align: center;
      border: 1px solid #7f9a90;
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 14px 32px rgba(48, 75, 82, .10);
    }

    .date-card span {
      display: block;
      color: #9a6d34;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .date-card strong {
      display: block;
      margin: 8px 0;
      color: #21333d;
      font-family: Georgia, serif;
      font-size: 52px;
      line-height: .86;
    }

    .workbench {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(310px, .85fr);
      gap: 18px;
      margin-top: 18px;
    }

    /* Double-bezel for panels */
    .panel {
      position: relative;
      min-width: 0;
      padding: 3px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(255, 255, 250, .9), rgba(224, 228, 221, .6));
      box-shadow: var(--shadow-tinted);
    }

    .panel-inner {
      border-radius: calc(var(--radius-lg) - 3px);
      background: rgba(255, 255, 250, .82);
      padding: 24px;
      box-shadow: var(--shadow-inner);
      height: 100%;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line-soft);
    }

    .panel h2, .panel-title h2 {
      margin: 0;
      color: #1e2b34;
      font-size: 22px;
      line-height: 1.2;
    }

    .panel-title span {
      color: var(--sage);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .timeline {
      display: grid;
      gap: 2px;
    }

    .task {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--line-soft);
      transition: all 0.3s var(--ease-out);
    }

    .task:hover {
      background: rgba(245, 247, 242, .4);
      padding-left: 8px;
      padding-right: 8px;
    }

    .task:last-child { border-bottom: 0; }

    .time {
      color: var(--sage);
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    .task strong {
      display: block;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.35;
    }

    .task small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .level {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid #b6c3bd;
      border-radius: 999px;
      background: #eef2ee;
      color: #526d62;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .level.hot {
      border-color: var(--navy);
      background: var(--navy);
      color: #f7f4eb;
    }

    .side-stack {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .priority-list {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .priority {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .pin {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--sage);
      color: #fffef7;
      font-size: 12px;
      font-weight: 900;
    }

    .priority b {
      display: block;
      color: var(--ink);
      line-height: 1.35;
    }

    .priority small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      line-height: 1.45;
    }

    .drawer-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .drawer-grid span {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid #c8d1cc;
      border-radius: 999px;
      background: var(--paper-soft);
      color: #44565b;
      font-size: 13px;
      font-weight: 700;
    }

    .briefing-note {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      margin-top: 18px;
      padding: 17px 20px;
      border: 1px solid #cfd8d2;
      border-left: 5px solid var(--copper);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, rgba(208,179,124,.16), transparent 34%),
        rgba(255,255,250,.78);
    }

    .note-label {
      margin: 0 0 4px;
      color: #9a6d34;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .briefing-note p:last-child {
      margin: 0;
      color: #38464d;
      font-size: 16px;
      line-height: 1.65;
    }

    .briefing-note strong { color: #1f323d; }

    .note-actions {
      display: flex;
      gap: 8px;
      white-space: nowrap;
    }

    .note-actions button {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid #c8d1cc;
      border-radius: 999px;
      background: linear-gradient(135deg, #f5f7f2, rgba(245, 247, 242, .8));
      color: #526d62;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s var(--ease-spring);
      box-shadow: 0 2px 8px rgba(34, 48, 54, .06);
    }

    .note-actions button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(34, 48, 54, .1);
      border-color: var(--copper);
    }

    .note-actions button:active {
      transform: translateY(0);
      transition-duration: 0.1s;
    }

    /* Scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.6s var(--ease-out), transform 0.6s var(--ease-out);
    }
    .reveal.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* Skeleton loading */
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, rgba(224, 228, 221, .4) 25%, rgba(245, 247, 242, .6) 50%, rgba(224, 228, 221, .4) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s ease-in-out infinite;
      border-radius: 8px;
    }

    .footer {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px 36px;
      color: var(--faint);
      font-size: 13px;
    }

    .footer a {
      color: var(--sage);
      font-weight: 800;
    }

    @media (max-width: 880px) {
      .topbar-inner { padding: 0 18px; }
      .schedule-shell { padding: 24px 18px 40px; }
      .bureau-hero, .workbench, .briefing-note { grid-template-columns: 1fr; }
      .date-card { width: 128px; }
      .task { grid-template-columns: 64px minmax(0, 1fr); }
      .level { grid-column: 2; justify-self: start; }
      .note-actions { flex-wrap: wrap; white-space: normal; }
    }

    @media (max-width: 540px) {
      .brand-caption { display: none; }
      .back-link { padding: 0 10px; font-size: 12px; }
      .bureau-hero-inner, .panel-inner, .briefing-note { padding: 20px; border-radius: 20px; }
      h1 { font-size: 38px; }
      .lead { font-size: 15px; }
      .task { grid-template-columns: 1fr; gap: 5px; }
      .level { grid-column: 1; }
      .date-card strong { font-size: 46px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/niu-secretary/">
        <img src="logo.png" alt="牛秘书">
        <span>
          <span class="brand-name">牛秘书时务局</span>
          <span class="brand-caption">Schedule Bureau</span>
        </span>
      </a>
      <a class="back-link" href="/niu-secretary/">返回主页</a>
    </div>
  </header>

  <main class="schedule-shell">
    <section class="bureau-hero">
      <div class="bureau-hero-inner">
        <div>
          <p class="kicker">Schedule Bureau</p>
          <h1>时务局</h1>
          <p class="lead">排班、提醒、代办和目标，一夹搞定。</p>
        </div>
        <div class="date-card" aria-label="今日日期">
          <div>
            <span id="today-month">今日</span>
            <strong id="today-day">--</strong>
            <span id="today-weekday">星期--</span>
          </div>
        </div>
      </div>
    </section>

    <section class="workbench">
      <section class="panel schedule-panel reveal">
        <div class="panel-inner">
          <div class="panel-title">
            <h2>今日排班</h2>
            <span id="today-count">0 项</span>
          </div>
          <div class="timeline" id="timeline"></div>
        </div>
      </section>

      <aside class="side-stack">
        <section class="panel reveal">
          <div class="panel-inner">
            <h2>秘书提醒</h2>
            <div class="priority-list" id="priority-list"></div>
          </div>
        </section>

        <section class="panel reveal">
          <div class="panel-inner">
            <h2>事务抽屉</h2>
            <nav class="drawer-grid" aria-label="时务局模块" id="drawer-grid"></nav>
          </div>
        </section>
      </aside>
    </section>

    <section class="briefing-note reveal">
      <div>
        <p class="note-label">今日批注</p>
        <p><strong>上午处理要务，下午清杂事，晚上收档。</strong> 日程不需要排满，需要排准；今天完成三件关键事即可。</p>
      </div>
      <div class="note-actions">
        <button type="button">生成明日预排</button>
        <button type="button">收进复盘</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>牛秘书时务局 · <a href="/niu-secretary/">牛秘书品牌主页</a></p>
  </footer>

  <script>
    (function() {
      // Scroll reveal animation
      const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
            observer.unobserve(entry.target);
          }
        });
      }, observerOptions);

      document.querySelectorAll('.reveal').forEach(el => {
        observer.observe(el);
      });

      const now = new Date();
      const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const todayStr = now.toISOString().slice(0, 10);

      document.getElementById('today-month').textContent = `${now.getMonth() + 1}月`;
      document.getElementById('today-day').textContent = now.getDate();
      document.getElementById('today-weekday').textContent = weekdays[now.getDay()];

      function readJson(key) {
        try {
          const value = JSON.parse(localStorage.getItem(key) || '[]');
          return Array.isArray(value) ? value : [];
        } catch (error) {
          return [];
        }
      }

      const store = {
        events: readJson('niu_schedule_events'),
        todos: readJson('niu_schedule_todos'),
        dates: readJson('niu_schedule_dates'),
        goals: readJson('niu_schedule_goals')
      };

      const todayEvents = store.events
        .filter(event => event.date === todayStr)
        .sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));

      const sampleTasks = [
        { time: '09:30', title: '晨间梳理', note: '新闻社简报、邮件、今日三件大事', type: '要务', hot: true },
        { time: '11:00', title: '项目推进', note: '确认时务局原型、整理待发布清单', type: '工作' },
        { time: '15:20', title: '生活代办', note: '账单、快递、晚间训练提醒', type: '生活' },
        { time: '21:40', title: '复盘收档', note: '完成记录、明日预排、目标进度更新', type: '复盘' }
      ];

      const tasks = todayEvents.length
        ? todayEvents.map((event, index) => ({
            time: event.time || '全天',
            title: event.title || event.name || '未命名日程',
            note: event.notes || event.description || '来自你的日程记录',
            type: event.type || (index === 0 ? '要务' : '日程'),
            hot: index === 0
          }))
        : sampleTasks;

      const timeline = document.getElementById('timeline');
      timeline.innerHTML = tasks.map(task => `
        <div class="task">
          <div class="time">${task.time}</div>
          <div>
            <strong>${task.title}</strong>
            <small>${task.note}</small>
          </div>
          <span class="level ${task.hot ? 'hot' : ''}">${task.type}</span>
        </div>
      `).join('');
      document.getElementById('today-count').textContent = `${tasks.length} 项`;

      const pendingTodos = store.todos.filter(todo => !todo.done).length;
      const upcomingDates = store.dates.filter(item => {
        if (!item.date) return false;
        const normalized = item.date.replace('XXXX', now.getFullYear());
        const target = new Date(normalized);
        if (Number.isNaN(target.getTime())) return false;
        const diff = (target - now) / 86400000;
        return diff >= -1 && diff <= 30;
      }).length;
      const maxStreak = store.goals.reduce((max, goal) => Math.max(max, Number(goal.streak || 0)), 0);

      const priorities = [
        ['1', '今天只抓三件事', pendingTodos ? `还有 ${pendingTodos} 项待办，先保留最关键的。` : '优先级压缩，避免待办墙失控。'],
        ['2', '重要日期提前露出', upcomingDates ? `未来 30 天有 ${upcomingDates} 个重要日期。` : '生日、缴费、证件、纪念日集中看。'],
        ['3', '长期目标拆到今天', maxStreak ? `当前最长连续打卡 ${maxStreak} 天。` : '目标不是口号，而是当天动作。']
      ];

      document.getElementById('priority-list').innerHTML = priorities.map(item => `
        <div class="priority">
          <div class="pin">${item[0]}</div>
          <div><b>${item[1]}</b><small>${item[2]}</small></div>
        </div>
      `).join('');

      const drawers = ['日程核心', '重要日期', '生活代办', '目标追踪', '阅读学习', '出行助手'];

      document.getElementById('drawer-grid').innerHTML = drawers.map(label => `<span>${label}</span>`).join('');
    })();
  </script>
</body>
</html>
